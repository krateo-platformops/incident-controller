# Roles for the people who act on incidents through the portal, which calls the apiserver with the
# clicking user's own token. The chart binds neither: bind them to your groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krateo-incident-viewer
  labels:
    {{- include "incident-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["observability.krateo.io"]
    resources: ["incidents", "incidentapplies"]
    verbs: ["get", "list", "watch"]
---
# Close ("spec.closed"), "I applied it" ("spec.applied"), Discard (delete), and Run apply (create an
# IncidentApply; the script then runs with the clicking user's own rights).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krateo-incident-responder
  labels:
    {{- include "incident-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["observability.krateo.io"]
    resources: ["incidents"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["observability.krateo.io"]
    resources: ["incidentapplies"]
    verbs: ["get", "list", "watch", "create"]
