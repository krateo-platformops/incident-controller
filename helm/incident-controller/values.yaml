# The controller image. tag defaults to the chart appVersion (the release tag).
image:
  repository: ghcr.io/krateo-platformops/incident-controller
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: incident-controller

controller:
  debug: false
  # Time from the end of one check of an incident to the start of the next.
  pollInterval: 1m
  # How long, from entering Verifying, a verify exit 1 is retried before the incident goes back
  # to Open.
  settleWindow: 5m
  syncPeriod: 1h
  maxReconcileRate: 5
  leaderElection: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Run apply: each IncidentApply runs its incident's apply script in a check pod, with the client
# certificate authn issued the user who created it, never the controller's or a service account's.
apply:
  # Deadline of one run (the apply pod's activeDeadlineSeconds).
  timeoutSeconds: 120
  # How long a finished IncidentApply is kept before the controller deletes it.
  ttl: 720h
  # Namespace of the <username>-clientconfig Secrets authn writes at login. Empty means the release
  # namespace. The controller reads Secrets there.
  credentialsNamespace: ""

# The check pods: they run the precondition and verify scripts, and the apply script of an
# IncidentApply.
checks:
  # A namespace holding only the check pods and their service account, so the controller's right
  # to create pods reaches no other service account.
  namespace: krateo-incident-checks
  createNamespace: true
  # Deadline of one check run (the pod's activeDeadlineSeconds).
  timeoutSeconds: 60
  serviceAccount: incident-check
  # Cluster roles the check service account is bound to, besides incident-controller-check-reader.
  # view adds pods' logs to what that role reads.
  clusterRoles:
    - view
  # How often the controller rewrites the incident-controller-check-reader ClusterRole from
  # discovery: get, list and watch on every resource the API server serves except Secrets and
  # subresources, so a resource installed later becomes readable within this interval.
  readerRefresh: 5m
  # bash, kubectl and jq. tag defaults to the chart appVersion.
  image:
    repository: ghcr.io/krateo-platformops/incident-controller-check
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
  nodeSelector: {}
  tolerations: []
  networkPolicy:
    enabled: true
    # The only egress: the apiserver, [{cidr: 10.0.0.1/32, ports: [443]}]. Empty means the
    # kubernetes Service and its EndpointSlice are looked up at install; a render without cluster
    # access (helm template) then allows no egress at all, so checks cannot reach the apiserver.
    apiServer: []
