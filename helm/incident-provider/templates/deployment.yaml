apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incident-provider.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incident-provider.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "incident-provider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incident-provider.selectorLabels" . | nindent 8 }}
      annotations:
        # The controller reads the template at start: a change rolls the pod.
        checksum/check-pod: {{ include "incident-provider.checkPod" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "incident-provider.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: INCIDENT_PROVIDER_DEBUG
              value: {{ .Values.controller.debug | quote }}
            - name: INCIDENT_PROVIDER_POLL_INTERVAL
              value: {{ .Values.controller.pollInterval | quote }}
            - name: INCIDENT_PROVIDER_SETTLE_WINDOW
              value: {{ .Values.controller.settleWindow | quote }}
            - name: INCIDENT_PROVIDER_SYNC_PERIOD
              value: {{ .Values.controller.syncPeriod | quote }}
            - name: INCIDENT_PROVIDER_MAX_RECONCILE_RATE
              value: {{ .Values.controller.maxReconcileRate | quote }}
            - name: INCIDENT_PROVIDER_LEADER_ELECTION
              value: {{ .Values.controller.leaderElection | quote }}
            - name: INCIDENT_PROVIDER_CHECKS_NAMESPACE
              value: {{ .Values.checks.namespace | quote }}
            - name: INCIDENT_PROVIDER_CHECK_READER_ROLE
              value: {{ printf "%s-check-reader" (include "incident-provider.name" .) | quote }}
            - name: INCIDENT_PROVIDER_CHECK_READER_REFRESH
              value: {{ .Values.checks.readerRefresh | quote }}
            - name: INCIDENT_PROVIDER_CHECK_TIMEOUT
              value: {{ printf "%ds" (int .Values.checks.timeoutSeconds) | quote }}
            - name: INCIDENT_PROVIDER_APPLY_TIMEOUT
              value: {{ printf "%ds" (int .Values.apply.timeoutSeconds) | quote }}
            - name: INCIDENT_PROVIDER_APPLY_TTL
              value: {{ .Values.apply.ttl | quote }}
            - name: INCIDENT_PROVIDER_CREDENTIALS_NAMESPACE
              value: {{ include "incident-provider.credentialsNamespace" . | quote }}
            - name: INCIDENT_PROVIDER_CHECK_POD_TEMPLATE
              value: /etc/incident-provider/check-pod.yaml
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          volumeMounts:
            - name: check-pod
              mountPath: /etc/incident-provider
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: check-pod
          configMap:
            name: {{ include "incident-provider.name" . }}-check-pod
