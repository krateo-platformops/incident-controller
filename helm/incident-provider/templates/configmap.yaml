# The check pod template the controller loads at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "incident-provider.name" . }}-check-pod
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incident-provider.labels" . | nindent 4 }}
data:
  check-pod.yaml: |
    {{- include "incident-provider.checkPod" . | nindent 4 }}
